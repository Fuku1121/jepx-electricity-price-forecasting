name: tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Import every module
        run: python -c "import jepx_forecasting.data, jepx_forecasting.features, jepx_forecasting.splits, jepx_forecasting.baseline, jepx_forecasting.lear, jepx_forecasting.metrics, jepx_forecasting.pipeline, jepx_forecasting.battery, jepx_forecasting.optimization, jepx_forecasting.backtest"
      - run: python -m pytest -q
